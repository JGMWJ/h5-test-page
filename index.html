<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Common.js 完整功能测试</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mui/3.7.1/css/mui.min.css" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mui/3.7.1/js/mui.min.js">
    </script>
    
    <!-- ✅ 官方方式：引入 uni 的 WebView SDK（可选，但推荐） -->
    <!-- 注意：如果 App 端已经自动注入，这个脚本可以不加 -->
    <script type="text/javascript" src="https://gitcode.com/dcloud/uni-app/tree/uni-app-vue2-dev/dist/uni.webview.1.5.8.js"></script>
    
    <style>
        /* ... 样式保持不变 ... */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { padding-top: 60px; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .top-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: linear-gradient(135deg, #4A69FF 0%, #6a8cff 100%); color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(74, 105, 255, 0.3); }
        .top-bar .title { font-weight: 600; font-size: 16px; letter-spacing: 0.5px; }
        .top-bar .info { font-size: 12px; background: rgba(255, 255, 255, 0.2); padding: 4px 12px; border-radius: 20px; backdrop-filter: blur(4px); }
        .embedded-app-webview .top-bar { background: linear-gradient(135deg, #28a745 0%, #34ce57 100%); }
        .embedded-app-webview .card { border-left: 4px solid #28a745; }
        .card { margin: 12px 16px; padding: 16px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
        .card h3 { margin-top: 0; margin-bottom: 12px; font-size: 15px; color: #333; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }
        .card h3 .badge { float: right; font-size: 12px; font-weight: normal; background: #e9ecef; padding: 2px 10px; border-radius: 12px; color: #666; }
        .route-display { font-family: 'Courier New', monospace; background: #f8f9fa; padding: 12px 14px; border-radius: 8px; word-break: break-all; font-size: 14px; border: 1px solid #e9ecef; }
        .route-display .highlight { color: #4A69FF; font-weight: bold; }
        .status-row { display: flex; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
        .status-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .status-item .label { color: #666; }
        .status-badge { display: inline-block; padding: 2px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .status-badge.active { background: #d4edda; color: #155724; }
        .status-badge.inactive { background: #f8d7da; color: #721c24; }
        .status-badge.warning { background: #fff3cd; color: #856404; }
        .btn-group { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
        .btn-group button { flex: 1; min-width: 60px; padding: 10px 0; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; color: #fff; }
        .btn-group button:active { transform: scale(0.96); opacity: 0.8; }
        .btn-primary { background: #4A69FF; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn-warning { background: #fd7e14; }
        .btn-secondary { background: #6c757d; }
        .btn-outline { background: transparent; color: #4A69FF; border: 2px solid #4A69FF; }
        .message-box { background: #f8f9fa; padding: 12px 14px; border-radius: 8px; font-size: 13px; min-height: 50px; border: 1px solid #e9ecef; font-family: 'Courier New', monospace; white-space: pre-wrap; word-break: break-all; }
        .message-box .empty { color: #adb5bd; }
        .log-area { background: #1a1a2e; color: #e0e0e0; padding: 12px 14px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 250px; overflow-y: auto; margin-top: 10px; line-height: 1.8; }
        .log-area .log-entry { border-bottom: 1px solid #2a2a4a; padding: 3px 0; }
        .log-area .log-entry .time { color: #6c757d; margin-right: 10px; }
        .log-area .log-entry .info { color: #4fc3f7; }
        .log-area .log-entry .success { color: #81c784; }
        .log-area .log-entry .error { color: #e57373; }
        .log-area .log-entry .warn { color: #ffb74d; }
        .session-info { background: #f8f9fa; padding: 10px 14px; border-radius: 8px; font-size: 13px; border: 1px solid #e9ecef; margin-top: 10px; }
        .session-info .key { color: #6c757d; }
        .session-info .value { color: #4A69FF; font-weight: 500; }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-track { background: #1a1a2e; }
        .log-area::-webkit-scrollbar-thumb { background: #4A69FF; border-radius: 4px; }
        
        /* 消息发送状态 */
        .msg-status {
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 13px;
        }
        .msg-status.success {
            background: #d4edda;
            color: #155724;
        }
        .msg-status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .msg-status.pending {
            background: #fff3cd;
            color: #856404;
        }
    </style>
</head>
<body>

    <div class="top-bar" id="topBar">
        <span class="title">🧪 Common.js 完整测试</span>
        <span class="info" id="envStatus">检测中...</span>
    </div>

    <div id="app">
        <div class="card">
            <h3>📍 当前路由 <span class="badge" id="routeBadge">H5</span></h3>
            <div class="route-display" id="routeDisplay">
                <span class="highlight">/</span>
            </div>
            <div class="status-row">
                <div class="status-item">
                    <span class="label">🔙 H5返回:</span>
                    <span id="canBackDisplay" class="status-badge inactive">否</span>
                </div>
                <div class="status-item">
                    <span class="label">📱 关闭Webview:</span>
                    <span id="shouldCloseDisplay" class="status-badge inactive">否</span>
                </div>
                <div class="status-item">
                    <span class="label">📊 History长度:</span>
                    <span id="historyLength" class="status-badge warning">0</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="navigateTo('/home')">🏠 /home</button>
                <button class="btn-success" onclick="navigateTo('/login')">🔐 /login</button>
                <button class="btn-warning" onclick="navigateTo('/auto-login')">🔄 /auto-login</button>
                <button class="btn-primary" onclick="navigateTo('/my')">👤 /my</button>
                <button class="btn-secondary" onclick="navigateTo('/detail')">📄 /detail</button>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" onclick="window.history.back()">⬅️ 浏览器返回</button>
                <button class="btn-warning" onclick="mockAppBack()">📱 模拟App返回</button>
                <button class="btn-outline" onclick="setFromAutoLogin()">🔑 设置 AutoLogin</button>
                <button class="btn-outline" onclick="clearFromAutoLogin()">🗑️ 清除 AutoLogin</button>
            </div>
            <div id="msgStatus" class="msg-status pending" style="display:none;">
                等待发送消息...
            </div>
        </div>

        <div class="card">
            <h3>🔐 Session 状态</h3>
            <div class="session-info" id="sessionInfo">
                <div><span class="key">fromAutoLogin:</span> <span class="value" id="sessionValue">未设置</span></div>
            </div>
        </div>

        <div class="card">
            <h3>📨 与App通信 (uni.postMessage)</h3>
            <div class="message-box" id="messageDisplay">
                <span class="empty">等待消息...</span>
            </div>
        </div>

        <div class="card">
            <h3>📋 日志 <span class="badge" id="logCount">0</span></h3>
            <div id="statusLogs" class="log-area">
                <div class="log-entry"><span class="time">[启动]</span> <span class="info">⏳ 页面初始化...</span></div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        // ================================================================
        // 官方标准方式：等待 UniAppJSBridgeReady 事件
        // ================================================================
        document.addEventListener('UniAppJSBridgeReady', function() {
            console.log('[Bridge] ✅ UniAppJSBridgeReady 触发，uni 对象已就绪');
            addLog('✅ UniAppJSBridgeReady 事件触发', 'success');
            
            // 获取当前环境
            if (typeof uni !== 'undefined' && uni.getEnv) {
                uni.getEnv(function(res) {
                    console.log('[Bridge] 当前环境:', JSON.stringify(res));
                    addLog('📊 环境信息: ' + JSON.stringify(res), 'info');
                });
            }
            
            // 标记 uni 已就绪
            window.__uniReady = true;
            updateUI();
        });

        // ================================================================
        // 如果 uni 已经存在（App 自动注入），直接标记就绪
        // ================================================================
        if (typeof window.uni !== 'undefined') {
            console.log('[Bridge] ✅ uni 对象已存在（App 自动注入）');
            window.__uniReady = true;
            
            // 如果 uni.getEnv 可用，获取环境信息
            if (uni.getEnv) {
                uni.getEnv(function(res) {
                    console.log('[Bridge] 当前环境:', JSON.stringify(res));
                    addLog('📊 环境信息: ' + JSON.stringify(res), 'info');
                });
            }
        } else {
            console.log('[Bridge] ⏳ 等待 uni 对象注入...');
        }

        // ================================================================
        // 工具函数
        // ================================================================
        function addLog(message, type) {
            type = type || 'info';
            var logArea = document.getElementById('statusLogs');
            var time = new Date().toLocaleTimeString();
            var entry = document.createElement('div');
            entry.className = 'log-entry';
            var iconMap = { 'info': 'ℹ️', 'success': '✅', 'error': '❌', 'warn': '⚠️' };
            entry.innerHTML = '<span class="time">[' + time + ']</span> <span class="' + type + '">' + (iconMap[type] ||
                '') + ' ' + message + '</span>';
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
            document.getElementById('logCount').textContent = logArea.children.length;
        }

        function showMsgStatus(message, type) {
            var el = document.getElementById('msgStatus');
            el.style.display = 'block';
            el.textContent = message;
            el.className = 'msg-status ' + type;
        }

        // ================================================================
        // Common.js 核心逻辑
        // ================================================================
        function isEmbeddedAppWebview() {
            try {
                if (sessionStorage.getItem('fromAutoLogin') === '1') return true;
            } catch (e) {}
            if (window.__uniapp_webview_id || (window.uni && window.uni.webView)) return true;
            if (window.__uniapp_x_postMessage || window.__dcloud_weex_postMessage) return true;
            var ua = navigator.userAgent || '';
            if (/Html5Plus/i.test(ua) && !window.plus) return true;
            if (/Html5Plus/i.test(ua) && /^https?:/.test(window.location.protocol)) return true;
            if (/uni-app/i.test(ua) && (!window.plus || window.__uniapp_webview_id)) return true;
            if (window.location.search.indexOf('embedded=true') !== -1) return true;
            return false;
        }

        function getHashRoute() {
            var hash = window.location.hash || '';
            return hash.replace(/^#/, '') || '/';
        }

        function shouldCloseWebviewOnBack() {
            var route = getHashRoute().split('?')[0];
            if (route.indexOf('/login') !== -1 || route.indexOf('/auto-login') !== -1) return true;
            try {
                if (sessionStorage.getItem('fromAutoLogin') === '1') {
                    var homeRoutes = ['/home', '/my', '/'];
                    if (homeRoutes.indexOf(route) !== -1) return true;
                }
            } catch (e) {}
            return false;
        }

        function canH5GoBack() {
            if (shouldCloseWebviewOnBack()) return false;
            var route = getHashRoute();
            var homeRoutes = ['/home', '/my', '/'];
            if (homeRoutes.indexOf(route) !== -1 || route.indexOf('/login') !== -1) return false;
            return window.history.length > 1;
        }

        // ================================================================
        // ✅ 官方标准方式：mockAppBack
        // ================================================================
        function mockAppBack() {
            addLog('🖱️ 用户点击 "模拟App返回"', 'warn');
            showMsgStatus('正在发送消息...', 'pending');
            
            // 确保 uni 对象可用
            if (typeof window.uni === 'undefined') {
                addLog('❌ uni 对象不可用，请等待 UniAppJSBridgeReady', 'error');
                showMsgStatus('❌ uni 对象不可用', 'error');
                return;
            }
            
            // 构造消息数据（官方标准格式）
            var payload = {
                type: 'appBack',
                action: 'navigateBack',
                shouldClose: shouldCloseWebviewOnBack(),
                canBack: canH5GoBack(),
                route: getHashRoute()
            };
            
            try {
                // ✅ 官方标准方式：调用 uni.postMessage
                uni.postMessage({
                    data: payload
                });
                
                addLog('📤 发送 appBack 消息至App: ' + JSON.stringify(payload), 'info');
                showMsgStatus('✅ 消息已发送: ' + payload.type, 'success');
                
                // 显示在消息框中
                var displayDiv = document.getElementById('messageDisplay');
                displayDiv.innerHTML = '<span style="color:#4A69FF;">📤 发送至App:</span>\n' + JSON.stringify(payload, null, 2);
                
            } catch (e) {
                addLog('❌ 发送失败: ' + e.message, 'error');
                showMsgStatus('❌ 发送失败: ' + e.message, 'error');
            }
        }

        // ================================================================
        // 路由导航
        // ================================================================
        function navigateTo(route) {
            window.location.hash = route;
            addLog('🔄 导航到: ' + route, 'info');
        }

        function setFromAutoLogin() {
            try {
                sessionStorage.setItem('fromAutoLogin', '1');
                addLog('🔑 已设置 sessionStorage.fromAutoLogin=1', 'success');
                updateUI();
            } catch (e) {
                addLog('❌ 设置失败: ' + e.message, 'error');
            }
        }

        function clearFromAutoLogin() {
            try {
                sessionStorage.removeItem('fromAutoLogin');
                addLog('🗑️ 已清除 sessionStorage.fromAutoLogin', 'info');
                updateUI();
            } catch (e) {
                addLog('❌ 清除失败: ' + e.message, 'error');
            }
        }

        // ================================================================
        // UI 更新
        // ================================================================
        function updateUI() {
            var route = getHashRoute();
            document.getElementById('routeDisplay').innerHTML = '<span class="highlight">' + (route || '/') + '</span>';
            document.getElementById('routeBadge').textContent = route || '/';
            
            var canBack = canH5GoBack();
            var shouldClose = shouldCloseWebviewOnBack();
            var historyLen = window.history.length;
            
            var canBackEl = document.getElementById('canBackDisplay');
            canBackEl.textContent = canBack ? '是' : '否';
            canBackEl.className = 'status-badge ' + (canBack ? 'active' : 'inactive');
            
            var shouldCloseEl = document.getElementById('shouldCloseDisplay');
            shouldCloseEl.textContent = shouldClose ? '是' : '否';
            shouldCloseEl.className = 'status-badge ' + (shouldClose ? 'active' : 'inactive');
            
            document.getElementById('historyLength').textContent = historyLen;
            document.getElementById('historyLength').className = 'status-badge ' + (historyLen > 1 ? 'active' : 'warning');
            
            var isEmbedded = isEmbeddedAppWebview();
            var envEl = document.getElementById('envStatus');
            envEl.textContent = isEmbedded ? '✅ App内嵌模式' : '🌐 普通浏览器';
            envEl.style.background = isEmbedded ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.2)';
            
            if (isEmbedded) {
                document.documentElement.classList.add('embedded-app-webview');
            } else {
                document.documentElement.classList.remove('embedded-app-webview');
            }
            
            var sessionVal = '未设置';
            try {
                var val = sessionStorage.getItem('fromAutoLogin');
                if (val !== null) sessionVal = val;
            } catch (e) {}
            document.getElementById('sessionValue').textContent = sessionVal;
            document.getElementById('sessionValue').style.color = sessionVal === '1' ? '#28a745' : '#6c757d';
        }

        // ================================================================
        // __embeddedWebviewGoBack - 供 App 调用
        // ================================================================
        window.__embeddedWebviewGoBack = function() {
            addLog('🔄 App 调用 __embeddedWebviewGoBack', 'info');
            mockAppBack();
            return true;
        };

        window.__embeddedWebviewCanBack = canH5GoBack;
        window.__ydyAppBack = mockAppBack;

        // ================================================================
        // 初始化
        // ================================================================
        function init() {
            addLog('🚀 开始初始化...', 'info');
            
            if (window.location.search.indexOf('fromAutoLogin=1') !== -1) {
                try {
                    sessionStorage.setItem('fromAutoLogin', '1');
                    addLog('🔑 从 URL 参数设置 fromAutoLogin=1', 'success');
                } catch (e) {}
            }
            
            var isEmbedded = isEmbeddedAppWebview();
            if (isEmbedded) {
                document.documentElement.classList.add('embedded-app-webview');
                addLog('✅ 已激活 "embedded-app-webview" 模式', 'success');
            } else {
                addLog('🌐 当前为普通浏览器模式 (可添加 ?embedded=true 激活)', 'info');
            }
            
            // 监听路由变化
            var notifyBackState = function() {
                var route = getHashRoute();
                addLog('🔄 路由变化: ' + route, 'info');
                updateUI();
            };
            
            window.addEventListener('hashchange', notifyBackState);
            window.addEventListener('popstate', notifyBackState);
            
            setTimeout(updateUI, 200);
            addLog('✅ 初始化完成!', 'success');
            
            window.__test = {
                isEmbedded: isEmbeddedAppWebview,
                getRoute: getHashRoute,
                canBack: canH5GoBack,
                shouldClose: shouldCloseWebviewOnBack,
                goBack: window.__embeddedWebviewGoBack,
                session: sessionStorage
            };
            console.log('🔧 调试对象: window.__test', window.__test);
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            document.addEventListener('DOMContentLoaded', init);
        }
    </script>
</body>
</html>
